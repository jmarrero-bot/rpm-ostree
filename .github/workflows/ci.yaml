---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Minimum supported Rust version (MSRV)
  ACTION_MSRV_TOOLCHAIN: 1.60.0
  # Pinned toolchain for linting
  ACTION_LINTS_TOOLCHAIN: 1.60.0

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    container: quay.io/coreos-assembler/fcos-buildroot:testing-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      # https://github.com/actions/checkout/issues/760
      - name: Mark git checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        run: ./ci/build.sh && make install DESTDIR=$(pwd)/install && tar -C install -czf install.tar .
      - name: Unit tests
        run: cargo test
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: install.tar
          path: install.tar
  compose-image:
    name: "compose-image tests"
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        RELEASE: ['44']
    container:
      image: quay.io/coreos-assembler/fcos-buildroot:testing-devel
      options: "--user root --privileged -v /var/tmp:/var/tmp"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install test dependencies
        run: ./ci/install-test-deps.sh
      - name: Download build
        uses: actions/download-artifact@v4.1.7
        with:
          name: install.tar
      - name: Install
        run: tar -C / -xzvf install.tar
      - name: Integration tests
        run: env TMPDIR=/var/tmp JOBS=3 RELEASE=${RELEASE} ./tests/compose-image.sh
        env:
          RELEASE: ${{ matrix.RELEASE }}
      - name: Diagnostics
        if: always()
        run: |
          set -x
          uname -a || true
          cat /proc/self/attr/current || true
          cat /proc/self/attr/apparmor/current || true
          cat /sys/module/apparmor/parameters/enabled || true
          ls /sys/kernel/security/apparmor/policy/profiles/ 2>&1 | head -50 || true
          grep -l bwrap /sys/kernel/security/apparmor/policy/profiles/*/name 2>/dev/null | xargs -r cat || true
          dmesg 2>&1 | grep -iE 'apparmor|denied|bwrap|sysusers|audit' | tail -40 || true
          capsh --print || true
          bwrap --version || true
          bwrap --bind / / --cap-drop ALL --cap-add cap_dac_override -- cat /proc/self/status | grep -i cap || true
          bwrap --bind / / --cap-drop ALL --cap-add cap_dac_override -- cat /proc/self/attr/current || true
          ls -l /etc/gshadow; bwrap --bind / / --cap-drop ALL --cap-add cap_dac_override -- head -c 20 /etc/gshadow && echo READ_OK || true

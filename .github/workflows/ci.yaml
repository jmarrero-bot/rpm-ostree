---
# Scratch experiment (jmarrero-forge/tracker#78): does bootc-dev/actions'
# bootc-host-setup AppArmor workaround let compose-image pass on ubuntu-26.04
# when the buildroot container is started from a host job?
name: CI

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:44
    steps:
      - name: Install git
        run: dnf -y install git-core clang-tools-extra cargo rustfmt cpio
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Mark git checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        run: ./ci/build.sh && make install DESTDIR=$(pwd)/install && tar -C install -czf install.tar .
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: install.tar
          path: install.tar
  compose-image:
    name: "compose-image f${{ matrix.RELEASE }} (${{ matrix.setup }})"
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { RELEASE: '44', setup: none }
          - { RELEASE: '43', setup: bootc-host-setup }
          - { RELEASE: '44', setup: bootc-host-setup }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Bootc host setup
        if: matrix.setup == 'bootc-host-setup'
        uses: bootc-dev/actions/bootc-host-setup@de95828443214c605662555316955bd1425b448d
      - name: Download build
        uses: actions/download-artifact@v4.1.7
        with:
          name: install.tar
      - name: Integration tests
        env:
          RELEASE: ${{ matrix.RELEASE }}
        run: |
          cat /etc/os-release | head -3
          sudo grep bwrap /sys/kernel/security/apparmor/profiles || true
          docker run --rm --privileged --user root -e RELEASE \
            -v /var/tmp:/var/tmp -v "$PWD:$PWD" -w "$PWD" \
            quay.io/coreos-assembler/fcos-buildroot:testing-devel bash -euxc '
              ./ci/install-test-deps.sh
              tar -C / -xzf install.tar
              dnf -y install "libssl.so.3()(64bit)"
              env TMPDIR=/var/tmp JOBS=3 ./tests/compose-image.sh'
